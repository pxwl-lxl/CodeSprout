<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeSprout | Contact</title>

    <link rel="stylesheet" href="../css/contact.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" href="../photos/favicon/sprout.png">
</head>

<body>

    <div class="site-container">
        <!-- ===== Header ===== -->
        <header>
            <nav class="main-navigation">
                <img src="../photos/header/sprout.gif" class="sprout" alt="Sprout">
                <a class="nav-name" href="../index.html">CodeSprout</a>
                <a href="../index.html">Home</a>
                <a href="../html/about.html">About</a>
                <a href="../html/contact.html">Contact</a>
                <a href="../index.html#tutorials-resources-id">Tutorials/Resources</a>
            </nav>
        </header>

        <!-- ===== Front page ===== -->
        <main>
            <section class="front-page-section">
                <img src="../photos/index/cloud.gif" class="cloud-right" alt="Cloud">
                <img src="../photos/index/cloud.gif" class="cloud-left" alt="Cloud">
                <img src="../photos/contact/evergreen-town.png" class="main-background" alt="A town in the meadows">
                <div class="background-overlay"></div>
                <div class="upper-black-section"></div>
            </section>

            <!-- ===== Content 1 ===== -->
            <section class="contact-section">
                <form>
                    <div class="personal-information-group">
                        <label for="first-name">
                            <h2>First Name</h2>
                        </label>
                        <input type="text" id="first-name" name="first-name" placeholder="First Name" required>
                        <div class="last-name-item">
                            <label for="last-name">
                                <h2>Last Name</h2>
                            </label>
                            <input type="text" id="last-name" name="last-name" placeholder="Last Name" required>
                        </div>
                        <div class="email-address-item">
                            <label for="email-address">
                                <h2>Email Address</h2>
                            </label>
                            <input type="email" id="email-address" name="email-address" placeholder="Email Address"
                                required>
                        </div>
                    </div>
                    <div class="message-details-group">
                        <label for="phone-number">
                            <h2>Phone Number</h2>
                        </label>
                        <input type="tel" id="phone-number" name="phone-number" placeholder="Phone Number" required>
                        <div class="website-message-item">
                            <label for="website-message">
                                <h2>Message</h2>
                                <textarea id="website-message" name="website-message" placeholder="Message"
                                    required></textarea>
                            </label>
                        </div>
                    </div>
                    <div class="form-actions-group">
                        <button class="submit-button" type="submit">Submit</button>
                        <div class="platform-link-group">
                            <a class="platform-link-item" href="https://github.com/pxwl-lxl" target="_blank">GitHub</a>
                            <a class="platform-link-item" href="https://www.instagram.com/pow.lxl/"
                                target="_blank">Instagram</a>
                            <a class="platform-link-item" href="https://x.com/pxwlxx" target="_blank">X</a>
                            <div class="platform-line-item">
                                <p>|</p>
                                <p>|</p>
                            </div>
                        </div>
                    </div>
                </form>
            </section>
        </main>

        <!-- ===== Footer ===== -->
        <footer>
            <h2 class=" copyright">&copy; 2026 CodeSprout | Binbinon | CC 201 Final Project</h2>
        </footer>
    </div>
</body>

</html>
